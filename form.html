 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Student Registration Form</title>

<link rel="stylesheet" href="form.css">
</head>
<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<fieldset>

<legend>Student Registration</legend>

<div class="form-group">
<label for="fullname">Full Name</label>
<input type="text" id="fullname" placeholder="Enter your full name" required>
</div>

<div class="form-group">
<label for="fathername">Father's Name</label>
<input type="text" id="fathername" placeholder="Enter father's name" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter password" minlength="8" maxlength="16" required>
</div>

<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>
</div>

<div class="form-group">
<label>Gender</label>

<div class="radio-group">

<label>
<input type="radio" name="gender" value="Male" required>
Male
</label>

<label>
<input type="radio" name="gender" value="Female">
Female
</label>

</div>

</div>

<div class="form-group">
<label for="age">Age</label>
<input type="number" id="age" placeholder="Enter your age">
</div>

<div class="form-group">
<label for="dob">Date of Birth</label>
<input type="date" id="dob">
</div>

<div class="form-group">
<label for="class">Select Class</label>

<select id="class">

<option value="">Select Class</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>

</div>

<div class="form-group">
<label>Hobbies</label>

<div class="checkbox-group">

<label>
<input type="checkbox" value="Reading">
Reading
</label>

<label>
<input type="checkbox" value="Sports">
Sports
</label>

<label>
<input type="checkbox" value="Coding">
Coding
</label>

<label>
<input type="checkbox" value="Gaming">
Gaming
</label>

</div>

</div>

<div class="form-group">
<label for="time">Preferred Time</label>
<input type="time" id="time">
</div>

<div class="form-group">
<label for="image">Upload Image</label>
<input type="file" id="image" accept="image/*">
</div>

<div class="buttons">
<input type="submit" value="Register">
<input type="reset" value="Reset">
</div>

</fieldset>

</form>

</div>

</body>
</html>
</html>
